# Sample workflow for building and deploying a Jekyll site with npm tasks to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"] # Changed from ["main"] to ["master"] as per original request

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Start: Added Node.js/npm steps ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Choose the Node.js version that fits your project
          node-version: '18' # Or '20', 'lts/*' etc. - match your project requirement
          # Cache npm dependencies for faster builds
          cache: 'npm'

      - name: Install npm dependencies
        # Use 'npm ci' for faster, more reliable installs in CI
        # Assumes you have a package-lock.json file
        run: npm ci

      - name: Run npm build script
        # Replace 'build' with the actual name of your script in package.json
        # e.g., if your script is 'npm run assets', use 'run: npm run assets'
        run: npm run build
      # --- End: Added Node.js/npm steps ---

      - name: Setup Pages
        id: setup-pages # Give the setup step an ID if needed later, though not strictly necessary here
        uses: actions/configure-pages@v5
        # If your npm script modifies files outside the source directory that Jekyll needs,
        # you might adjust configure-pages settings if necessary, but usually not required.

      - name: Build with Jekyll
        # This step builds the Jekyll site after npm tasks are complete
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          # future: true # Uncomment if you need future dated posts built

      - name: Upload artifact
        # Automatically uploads the ./_site directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job - No changes needed here
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Depends on the build job completing successfully
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
